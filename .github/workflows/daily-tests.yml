# Не проверено!

name: Daily Tests

on:
  schedule:
    - cron: "0 8 * * *" # Каждый день в 08:00 UTC (11:00 МСК)
  workflow_dispatch: # Разрешен ручной запуск

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npm run test # Скрипт запуска тестов
        env:
          CI: true

      - name: Generate Allure report
        if: always() # Генерировать даже при падении тестов
        uses: simple-elf/allure-report-action@v1
        with:
          results: allure-results

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 3
